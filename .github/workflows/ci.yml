# Kinelia CI — Theme Check lint gate.
#
# Skeleton no longer ships this workflow, so plan 01-03 creates it from scratch.
# The `theme-check` job below becomes a REQUIRED status check on `main` and
# `staging` in plan 01-07 — its display name is "Theme Check". Renaming the job
# later silently un-gates branch protection, so keep the name stable.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging

# The default GITHUB_TOKEN is read-only on this repo, so shopify/theme-check-action
# (which posts lint results as a Check with annotations when `token` is set) fails
# with "Resource not accessible by integration". Grant the two write scopes the
# action needs and nothing else. (Fix applied during plan 01-06 after the first
# push turned CI red; 01-07 proves it green on a pull request.)
permissions:
  checks: write
  pull-requests: write

jobs:
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Theme Check
        # `@v2` is a floating tag still pinned to a Feb-2024 build (Node 20,
        # older bundled Theme Check); `@v2.2.0` is the current v2 line and keeps
        # CI's linter in step with the local CLI, per plan 01-03's intent.
        uses: shopify/theme-check-action@v2.2.0
        with:
          token: ${{ github.token }}
