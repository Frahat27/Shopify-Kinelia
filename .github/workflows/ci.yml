# Kinelia CI — Theme Check lint gate.
#
# Skeleton no longer ships this workflow, so plan 01-03 creates it from scratch.
# The `theme-check` job below becomes a REQUIRED status check on `main` and
# `staging` in plan 01-07 — its display name is "Theme Check". Renaming the job
# later silently un-gates branch protection, so keep the name stable.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging

# shopify/theme-check-action posts lint results as a Check with annotations when
# `token` is set, which the default GITHUB_TOKEN cannot do ("Resource not
# accessible by integration"). Grant exactly the scopes needed — and `contents:
# read` explicitly, because declaring a `permissions:` block drops every scope
# not listed to `none`, which would break actions/checkout. (permissions + the
# @v2.2.0 pin were added in 01-06 after the first push turned CI red; the
# two-step job below was added in 01-07 after the gate-proof PR.)
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Nice-to-have: posts a "Theme Check Report" check with inline annotations
      # on the PR diff. This action does NOT fail its own job step on offences
      # (it only reflects them in that separate check) — plan 01-07 finding — so
      # it cannot be the gate on its own.
      - name: Theme Check annotations
        uses: shopify/theme-check-action@v2.2.0
        continue-on-error: true
        with:
          token: ${{ github.token }}
          flags: --fail-level error

      # The authoritative gate: this step's exit code is what makes the
      # "Theme Check" job — the required status check on main/staging — red on
      # an error-level offence. Same command as the local `npm run lint`.
      - name: Theme Check (gate)
        # KINELIA (plan 02-01): closes the Phase-1 residual T-01-12. check-allowlist.mjs
        # and check-secrets.mjs ran only in the local `npm run lint`, never in the
        # required CI job — a laptop-only check eventually stops running. All three
        # Node checkers (tokens, allowlist, secrets) now run in this same gate step,
        # right after the theme linter. Node is preinstalled on ubuntu-latest.
        run: |
          npm install -g @shopify/cli
          shopify theme check --fail-level error
          node scripts/check-tokens.mjs
          node scripts/check-allowlist.mjs
          node scripts/check-secrets.mjs
